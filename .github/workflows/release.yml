name: Release

# A v* tag builds the three installers and attaches them, with SHA256SUMS, to a
# draft GitHub Release. Nothing is public until someone presses Publish.
# Signing secrets live in the `release` environment and only the macOS job uses it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Compare tag and app version
        run: |
          app=$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml \
            | jq -r '.packages[] | select(.name == "audiobookconvert-rs") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $app in Cargo.toml"
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (universal, signed, notarized)
    needs: version
    runs-on: macos-latest
    environment: release
    timeout-minutes: 75
    env:
      # Plain text, so Tauri cannot pick another identity from the keychain
      APPLE_SIGNING_IDENTITY: 'Developer ID Application: Anthony Izzo (CMB5ZUJ2TB)'
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --prefix src-ui

      # Imported here rather than through APPLE_CERTIFICATE: Tauri deletes its own
      # temporary keychain after the build, and the DMG is signed after that.
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize the app
        run: npm exec --prefix src-ui tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Sign, notarize and staple the DMG
        run: |
          dmg=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          scripts/release/macos-notarize-dmg.sh "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Verify signature, notarization and architectures
        run: scripts/release/macos-verify.sh "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ${{ env.DMG }}
          if-no-files-found: error

  windows:
    name: Windows (x64 installer)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci --prefix src-ui

      # Tauri downloads its own NSIS; no separate install is needed
      - name: Build the installer
        run: npm exec --prefix src-ui tauri build -- --bundles nsis

      - name: Install and uninstall silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'AudiobookConvertRs'
          Get-ChildItem $dir | Format-Table Name, Length
          $uninstaller = Join-Path $dir 'uninstall.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\AudiobookConvertRs.lnk'
          if (-not (Get-ChildItem $dir -Filter *.exe | Where-Object Name -ne 'uninstall.exe')) { throw "no app executable in $dir" }
          if (-not (Test-Path $uninstaller)) { throw "no uninstaller in $dir" }
          if (-not (Test-Path $shortcut)) { throw "no Start menu entry at $shortcut" }
          # _?= runs the uninstaller in place, so -Wait waits for the real work
          Start-Process -FilePath $uninstaller -ArgumentList '/S', "_?=$dir" -Wait
          if (Get-ChildItem $dir -Filter *.exe | Where-Object Name -ne 'uninstall.exe') { throw "uninstall left the app in $dir" }
          "SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.SETUP }}
          if-no-files-found: error

  linux:
    name: Linux (.deb)
    needs: version
    # The oldest supported Ubuntu, so the package installs on 22.04 and later
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci --prefix src-ui

      - name: Build the package
        run: npm exec --prefix src-ui tauri build -- --bundles deb

      - name: Install the package with apt
        run: |
          deb=$(ls "$PWD"/target/release/bundle/deb/*.deb)
          dpkg-deb -f "$deb" Package Version Depends
          dpkg-deb -f "$deb" Depends | grep -qw ffmpeg || { echo "::error::the package does not depend on ffmpeg"; exit 1; }
          sudo apt-get install -y "$deb"
          dpkg -s "$(dpkg-deb -f "$deb" Package)" | grep '^Status: install ok installed'
          ffmpeg -version | head -1
          echo "DEB=$deb" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ env.DEB }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.dmg *.exe *.deb > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          name: AudiobookConvertRs ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/SHA256SUMS
