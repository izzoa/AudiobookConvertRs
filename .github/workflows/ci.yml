name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      # The app embeds src-ui/dist at compile time, so the frontend builds first
      - name: Build the frontend
        run: |
          npm ci --prefix src-ui
          npm run build --prefix src-ui

      - name: Frontend tests
        if: runner.os == 'Linux'
        run: npm test --prefix src-ui

      - name: Build
        run: cargo build --workspace --locked

      # Tests that need FFmpeg or the network are #[ignore] and stay skipped
      - name: Test
        run: cargo test --workspace --locked

      # Reported, not enforced, until the existing warnings are cleared
      - name: Clippy
        run: cargo clippy --workspace --locked

  fmt:
    name: Rust formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check
