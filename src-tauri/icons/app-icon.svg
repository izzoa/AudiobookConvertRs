<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="50%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect x="32" y="32" width="960" height="960" rx="180" ry="180" fill="url(#bgGrad)"/>

  <!-- Open book shape -->
  <g transform="translate(512, 520)">
    <!-- Left page -->
    <path d="M-40,-180 Q-200,-200 -320,-140 L-320,180 Q-200,120 -40,140 Z"
          fill="url(#bookGrad)" opacity="0.95"/>
    <!-- Right page -->
    <path d="M40,-180 Q200,-200 320,-140 L320,180 Q200,120 40,140 Z"
          fill="url(#bookGrad)" opacity="0.95"/>
    <!-- Book spine shadow -->
    <path d="M-40,-180 L-40,140 L40,140 L40,-180 Z" fill="#c7d2fe" opacity="0.6"/>
  </g>

  <!-- Audio waveform on book -->
  <g transform="translate(512, 520)">
    <!-- Left page waves -->
    <rect x="-260" y="-80" width="8" height="60" rx="4" fill="url(#waveGrad)"/>
    <rect x="-230" y="-100" width="8" height="100" rx="4" fill="url(#waveGrad)"/>
    <rect x="-200" y="-70" width="8" height="40" rx="4" fill="url(#waveGrad)"/>
    <rect x="-170" y="-90" width="8" height="80" rx="4" fill="url(#waveGrad)"/>
    <rect x="-140" y="-75" width="8" height="50" rx="4" fill="url(#waveGrad)"/>
    <rect x="-110" y="-95" width="8" height="90" rx="4" fill="url(#waveGrad)"/>

    <!-- Right page waves -->
    <rect x="102" y="-80" width="8" height="60" rx="4" fill="url(#waveGrad)"/>
    <rect x="132" y="-95" width="8" height="90" rx="4" fill="url(#waveGrad)"/>
    <rect x="162" y="-70" width="8" height="40" rx="4" fill="url(#waveGrad)"/>
    <rect x="192" y="-100" width="8" height="100" rx="4" fill="url(#waveGrad)"/>
    <rect x="222" y="-75" width="8" height="50" rx="4" fill="url(#waveGrad)"/>
    <rect x="252" y="-85" width="8" height="70" rx="4" fill="url(#waveGrad)"/>
  </g>

  <!-- Headphones -->
  <g transform="translate(512, 340)">
    <!-- Headband -->
    <path d="M-160,0 Q-180,-120 0,-140 Q180,-120 160,0"
          stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round"/>
    <!-- Left ear cup -->
    <ellipse cx="-165" cy="40" rx="50" ry="65" fill="#ffffff"/>
    <ellipse cx="-165" cy="40" rx="30" ry="45" fill="#4f46e5"/>
    <!-- Right ear cup -->
    <ellipse cx="165" cy="40" rx="50" ry="65" fill="#ffffff"/>
    <ellipse cx="165" cy="40" rx="30" ry="45" fill="#4f46e5"/>
  </g>

  <!-- Conversion arrow -->
  <g transform="translate(512, 750)">
    <path d="M-100,0 L60,0 L60,-25 L120,0 L60,25 L60,0"
          fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
  </g>
</svg>
