# AudiobookConvertRs - Workspace Configuration
# A high-performance audiobook converter written in Rust

[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["AudiobookConvertRs Contributors"]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/yourusername/AudiobookConvertRs"
description = "A cross-platform audiobook converter - convert audio files to M4B format"

[workspace.dependencies]
# Audio processing
symphonia = { version = "0.5", features = ["all"] }
mp4ameta = "0.13"
rodio = "0.19"

# Image processing
image = "0.25"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
camino = { version = "1.1", features = ["serde1"] }
walkdir = "2.4"
rayon = "1.10"
parking_lot = "0.12"
regex = "1.10"
once_cell = "1.19"
dirs = "5.0"

# Encoding
base64 = "0.22"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"

# Testing
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true

